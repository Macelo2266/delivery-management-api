services:
  db:
    image: postgres:16-alpine
    container_name: delivery-db
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${DB_NAME:-delivery_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}

    ports:
      - "5432:5432"

    volumes:
      - delivery-db-data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-delivery_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: delivery-api
    restart: unless-stopped

    depends_on:
      db:
        condition: service_healthy

    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-delivery_db}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
      SERVER_PORT: 8080

    ports:
      - "8080:8080"

volumes:
  delivery-db-data: