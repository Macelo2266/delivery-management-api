spring.application.name=delivery

# PostgreSQL
spring.datasource.url=jdbc:postgresql://${DB_HOST}/delivery_db
spring.datasource.username=${DB_USER}
spring.datasource.password=${MINHA_SENHA}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Server
server.port=${SERVER_PORT:8080}

# JWT
jwt.secret=${JWT_SECRET:change-this-secret-in-production-minimum-256-bits}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Swagger / SpringDoc
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs

# Desabilita o gerenciamento automatico de Docker Compose do Spring Boot
spring.docker.compose.enabled=false